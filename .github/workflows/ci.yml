name: CI/CD Pipeline

on:
  push:
    branches: [main, development, staging, production]
  pull_request:
    branches: [main, development, staging, production]

jobs:
  verify:
    name: Verify & Build
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run typecheck

      - name: Run unit tests with coverage
        run: npm run test:coverage
        env:
          DATABASE_URL: postgresql://localhost:5432/test
          DIRECT_URL: postgresql://localhost:5432/test
          CRON_SECRET: mock_cron_secret_for_ci
          QSTASH_TOKEN: mock_qstash_token_for_ci
          QSTASH_CURRENT_SIGNING_KEY: mock_current_signing_key_for_ci
          QSTASH_NEXT_SIGNING_KEY: mock_next_signing_key_for_ci
          RESEND_API_KEY: re_mock_api_key_for_ci
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key-ci
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Build application
        if: github.event_name == 'pull_request'
        run: npm run build
        env:
          DATABASE_URL: postgresql://localhost:5432/test
          DIRECT_URL: postgresql://localhost:5432/test
          CRON_SECRET: mock_cron_secret_for_ci_build
          QSTASH_TOKEN: mock_qstash_token_for_ci_build
          QSTASH_CURRENT_SIGNING_KEY: mock_current_signing_key_for_ci_build
          QSTASH_NEXT_SIGNING_KEY: mock_next_signing_key_for_ci_build
          RESEND_API_KEY: re_mock_api_key_for_ci_build
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key-ci
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  integration:
    name: Integration (Postgres 17)
    needs: verify
    runs-on: ubuntu-24.04-arm

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scholarbase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scholarbase_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/scholarbase_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Detect integration tests
        id: detect
        run: |
          if find test/integration -name '*.test.ts' 2>/dev/null | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No integration tests yet — skipping migration + test steps"
          fi

      - name: Apply migrations
        if: steps.detect.outputs.found == 'true'
        run: npx prisma migrate deploy

      - name: Run integration tests
        if: steps.detect.outputs.found == 'true'
        run: npm run test:integration

  deploy-staging:
    name: Build, Push & Deploy Staging
    needs: [verify, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.8.0

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ghcr.io/aaquibdilkash/scholarbase:staging
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
            NEXT_PUBLIC_CLOUDINARY_API_KEY=${{ secrets.NEXT_PUBLIC_CLOUDINARY_API_KEY }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}

      - name: Trigger Coolify deployment
        env:
          COOLIFY_STAGING_DEPLOY_URL: ${{ secrets.COOLIFY_STAGING_DEPLOY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          curl -fsS --request POST "$COOLIFY_STAGING_DEPLOY_URL" \
            --header "Authorization: Bearer $COOLIFY_API_TOKEN"

  deploy-production:
    name: Build, Push & Deploy Production
    needs: [verify, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.8.0

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ghcr.io/aaquibdilkash/scholarbase:production
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PROD_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PROD_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PROD_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PROD_PUBLIC_APP_URL }}
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
            NEXT_PUBLIC_CLOUDINARY_API_KEY=${{ secrets.NEXT_PUBLIC_CLOUDINARY_API_KEY }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}

      - name: Trigger Coolify deployment
        env:
          COOLIFY_PROD_DEPLOY_URL: ${{ secrets.COOLIFY_PROD_DEPLOY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          curl -fsS --request POST "$COOLIFY_PROD_DEPLOY_URL" \
            --header "Authorization: Bearer $COOLIFY_API_TOKEN"