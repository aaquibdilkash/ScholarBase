name: CI/CD Pipeline

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  verify:
    name: Verify & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run typecheck

      - name: Run unit tests
        # The unit suite is DB-free by construction: test/setup.ts mocks
        # `@/lib/db` so a test that reaches for the client fails loudly instead
        # of consuming a real database. These are mock credentials purely so
        # Next's build-time env loading has something to read.
        run: npm run test
        env:
          DATABASE_URL: postgresql://localhost:5432/test
          DIRECT_URL: postgresql://localhost:5432/test
          QSTASH_TOKEN: mock_qstash_token_for_ci
          QSTASH_CURRENT_SIGNING_KEY: mock_current_signing_key_for_ci
          QSTASH_NEXT_SIGNING_KEY: mock_next_signing_key_for_ci
          RESEND_API_KEY: re_mock_api_key_for_ci

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: postgresql://localhost:5432/test
          DIRECT_URL: postgresql://localhost:5432/test
          QSTASH_TOKEN: mock_qstash_token_for_ci_build
          QSTASH_CURRENT_SIGNING_KEY: mock_current_signing_key_for_ci_build
          QSTASH_NEXT_SIGNING_KEY: mock_next_signing_key_for_ci_build
          RESEND_API_KEY: re_mock_api_key_for_ci_build

  deploy:
    name: Deploy to Vercel
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Remove stale Vercel metadata
        run: rm -rf .vercel

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel@latest deploy ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=$VERCEL_TOKEN --yes