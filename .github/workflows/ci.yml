name: CI/CD Pipeline

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  verify:
    name: Verify & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run typecheck

      - name: Run unit tests with coverage
        run: npm run test:coverage
        env:
          DATABASE_URL: postgresql://localhost:5432/test
          DIRECT_URL: postgresql://localhost:5432/test
          CRON_SECRET: mock_cron_secret_for_ci
          QSTASH_TOKEN: mock_qstash_token_for_ci
          QSTASH_CURRENT_SIGNING_KEY: mock_current_signing_key_for_ci
          QSTASH_NEXT_SIGNING_KEY: mock_next_signing_key_for_ci
          RESEND_API_KEY: re_mock_api_key_for_ci
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key-ci
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: postgresql://localhost:5432/test
          DIRECT_URL: postgresql://localhost:5432/test
          CRON_SECRET: mock_cron_secret_for_ci_build
          QSTASH_TOKEN: mock_qstash_token_for_ci_build
          QSTASH_CURRENT_SIGNING_KEY: mock_current_signing_key_for_ci_build
          QSTASH_NEXT_SIGNING_KEY: mock_next_signing_key_for_ci_build
          RESEND_API_KEY: re_mock_api_key_for_ci_build
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key-ci
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  integration:
    name: Integration (Postgres 17)
    needs: verify
    runs-on: ubuntu-latest

    # Ephemeral, throwaway database — never a Supabase connection. The real
    # project is reached only by the app at runtime; tests get a local container
    # so raw-SQL behaviour (pg_trgm, to_tsvector, pg_class, cron procs) can be
    # exercised without touching the free tier's compute or connection pool.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scholarbase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scholarbase_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/scholarbase_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # The tier activates itself: with no files under test/integration the
      # migration and test steps are skipped rather than quietly passing, so the
      # first real integration test turns this job on with no CI edits.
      - name: Detect integration tests
        id: detect
        run: |
          if find test/integration -name '*.test.ts' 2>/dev/null | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No integration tests yet — skipping migration + test steps"
          fi

      - name: Apply migrations
        if: steps.detect.outputs.found == 'true'
        run: npx prisma migrate deploy

      - name: Run integration tests
        if: steps.detect.outputs.found == 'true'
        run: npm run test:integration

  deploy:
    name: Deploy to Vercel
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Remove stale Vercel metadata
        run: rm -rf .vercel

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel@latest deploy ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=$VERCEL_TOKEN --yes