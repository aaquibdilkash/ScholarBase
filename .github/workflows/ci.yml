name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run typecheck

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: postgresql://localhost:5432/test
          DIRECT_URL: postgresql://localhost:5432/test
          QSTASH_TOKEN: mock_qstash_token_for_ci_build
          QSTASH_CURRENT_SIGNING_KEY: mock_current_signing_key_for_ci_build
          QSTASH_NEXT_SIGNING_KEY: mock_next_signing_key_for_ci_build
